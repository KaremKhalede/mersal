name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # A throwaway Postgres service container, not a real database — matches the schema's actual
  # provider (SQLite stopped being valid the moment real `prisma migrate` history existed; see the
  # comment at the top of prisma/schema.prisma). Applied via `prisma migrate deploy`, the same
  # command staging/production use — CI is the first real exercise of that exact command+migration
  # history on every PR, not just a local claim that it works.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chargee_ci"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/chargee_ci"
  SESSION_SECRET: "ci-only-secret-not-used-in-production"
  STORAGE_DRIVER: "local"
  # No UPSTASH_REDIS_REST_URL/TOKEN in CI — the limiter fails open (src/lib/rate-limit.ts), so
  # /login and /track stay unthrottled here the same way DISABLE_RATE_LIMIT used to force.

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chargee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src tests playwright.config.ts playwright.staging.config.ts --max-warnings=9999

      - name: Apply migrations (same command staging/production use)
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start app and run Playwright suite
        run: |
          npm run dev &
          npx wait-on http://localhost:3000/login --timeout 60000
          npx playwright test
          kill %1

      - name: Production build
        run: npm run build

      # Builds the Dockerfile in complete isolation from the job's Postgres service — no
      # DATABASE_URL, no network path to it at all. This is the check that actually catches a page
      # quietly depending on a live database at build time (as /track once did: it has no auth
      # cookie and no dynamic params, so Next tried to statically prerender it, which only fails
      # when there truly is no database to reach — the step above always has one sitting right next
      # to it and would never have caught that). Anything deployed via Docker, or via a Cloudflare/CI
      # pipeline that builds before a database is provisioned, hits this exact failure mode.
      - name: Docker image builds with no database reachable
        run: docker build -t chargee:ci .

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
